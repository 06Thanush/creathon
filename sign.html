<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OSINT Duplicate Account Checker</title>

<style>
body {
    font-family: 'Courier New', monospace;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #330000, #660000, #990000);
    color: #ffbbbb;
}

h1 {
    text-align: center;
    margin-top: 20px;
    font-size: 36px;
    text-shadow: 0 0 8px #ff0000, 0 0 12px #ff5555;
}

.container {
    max-width: 650px;
    margin: 30px auto;
    background: rgba(255, 0, 0, 0.05); /* dim red background */
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    box-shadow: 0 0 25px #ff4444aa;
}

label {
    font-size: 18px;
    font-weight: bold;
    color: #ffaaaa;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 10px;
    border: none;
    font-size: 17px;
    outline: none;
    background: rgba(255, 100, 100, 0.2);
    color: #fff;
}
input:focus {
    background: rgba(255, 50, 50, 0.4);
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: #ff6666; /* dim red */
    color: white;
    font-weight: bold;
    transition: 0.3s;
    box-shadow: 0 4px 12px #ff4444;
}
button:hover {
    background: #cc0000;
    cursor: pointer;
    transform: scale(1.05);
}

.result {
    margin-top: 30px;
    font-size: 18px;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 0 12px #ff5555aa;
    background: rgba(255,0,0,0.05); /* dim red by default */
    color: #ffdddd;
}

/* Red = dangerous, Green = real/low risk */
.result.danger {
    background: rgba(255,0,0,0.25);
    color: #ff2222;
    border-left: 5px solid #ff0000;
}
.result.safe {
    background: rgba(0,150,0,0.25);
    color: #44ff77;
    border-left: 5px solid #00cc44;
}

.result a {
    display: block;
    margin-top: 12px;
    font-weight: bold;
    text-decoration: none;
    padding: 10px;
    border-radius: 10px;
    transition: 0.3s;
}
.result a:hover {
    color: #fff;
}

.back-btn {
    display: block;
    width: 220px;
    padding: 14px;
    margin: 20px auto 0 auto;
    background: #ff3333;
    text-align: center;
    border-radius: 12px;
    color: white;
    font-size: 18px;
    text-decoration: none;
    font-weight: bold;
    box-shadow: 0 4px 12px #ff5555;
    transition: 0.3s;
}
.back-btn:hover {
    background: #cc0000;
    transform: scale(1.05);
}
</style>
</head>
<body>

<h1>💀 OSINT Duplicate Account Checker</h1>

<div class="container">
    <label>Enter Username:</label>
    <input type="text" id="username" placeholder="Enter profile username">

    <button onclick="checkAccounts()">Check Across Platforms</button>

    <div id="results" class="result">Waiting for input...</div>

    <a href="main.html" class="back-btn">⬅ Back to Main Page</a>
</div>

<script>
function checkAccounts() {
    const username = document.getElementById("username").value.trim();
    const results = document.getElementById("results");

    if (username === "") {
        results.className = "result danger";
        results.innerHTML = "⚠️ Please enter a username.";
        return;
    }

    // Simulated risk logic: usernames with 'test' or 'fake' are dangerous
    const isDangerous = /test|fake/i.test(username);
    results.className = "result " + (isDangerous ? "danger" : "safe");

    const platforms = [
        {name: "Instagram", url: "https://www.instagram.com/"},
        {name: "Facebook", url: "https://www.facebook.com/"},
        {name: "Twitter (X)", url: "https://twitter.com/"},
        {name: "GitHub", url: "https://github.com/"},
        {name: "TikTok", url: "https://www.tiktok.com/@​"},
        {name: "Reddit", url: "https://www.reddit.com/user/"},
        {name: "LinkedIn", url: "https://www.linkedin.com/in/"},
        {name: "Pinterest", url: "https://www.pinterest.com/"},
        {name: "Snapchat", url: "https://www.snapchat.com/add/"}
    ];

    results.innerHTML = `<b>${isDangerous ? "⚠️ Suspicious username detected!" : "✅ Username appears safe"}</b><br><br>`;
    platforms.forEach(p => {
        const link = p.url + username;
        results.innerHTML += `<a href="${link}" target="_blank">${p.name}: ${link}</a>`;
    });
}
</script>

</body>
</html>
