<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Photo Metadata Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>

<style>
body {
    font-family: 'Courier New', monospace;
    margin: 0;
    padding: 40px;
    background: linear-gradient(135deg, #330000, #4d0000, #660000);
    color: #ffbbbb;
}

/* ---------- CONTAINER ---------- */
.container {
    max-width: 850px;
    background: rgba(255, 0, 0, 0.05); /* dim red background */
    backdrop-filter: blur(12px);
    color: #ffdddd;
    margin: auto;
    padding: 35px;
    border-radius: 25px;
    box-shadow: 0 0 35px #aa0000aa;
}

/* ---------- TITLE ---------- */
h1 {
    text-align: center;
    font-size: 40px;
    font-weight: bold;
    margin-bottom: 25px;
    text-shadow: 0 0 8px #aa0000, 0 0 12px #ff4444;
}

/* ---------- FILE INPUT ---------- */
input[type="file"] {
    width: 100%;
    padding: 15px;
    font-size: 18px;
    margin-top: 15px;
    border-radius: 15px;
    border: none;
    background: rgba(255, 100, 100, 0.2);
    color: #fff;
    transition: 0.3s;
    cursor: pointer;
}
input[type="file"]:hover {
    background: rgba(255, 50, 50, 0.4);
    transform: scale(1.02);
}

/* ---------- OUTPUT BOX ---------- */
#output {
    margin-top: 25px;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 12px #aa0000aa;
    font-size: 18px;
}

/* ---------- STATUS CLASSES ---------- */
.danger {
    background: rgba(255, 0, 0, 0.2);
    color: #ff2222;
    border-left: 5px solid #ff0000;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 8px;
}
.safe {
    background: rgba(0, 150, 0, 0.2);
    color: #44ff77;
    border-left: 5px solid #00cc44;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 8px;
}

/* ---------- MAP ---------- */
#map {
    width: 100%;
    height: 400px;
    margin-top: 25px;
    border-radius: 15px;
    display: none;
    box-shadow: 0 0 15px #ff5555aa;
}

/* ---------- BACK BUTTON ---------- */
.back-btn {
    width: 100%;
    display: block;
    margin-top: 30px;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: white;
    border-radius: 15px;
    text-decoration: none;
    background: linear-gradient(135deg, #ff0000, #cc0000);
    box-shadow: 0 4px 12px #aa0000;
    transition: 0.3s;
}
.back-btn:hover {
    background: linear-gradient(135deg, #cc0000, #990000);
    transform: scale(1.04);
}
</style>
</head>

<body>

<div class="container">
    <h1>💀 Photo Metadata Viewer</h1>

    <input type="file" id="photoInput" accept="image/*">

    <div id="output" class="danger">Waiting for image...</div>
    <div id="map"></div>

    <a class="back-btn" href="main.html">⬅ Back to Main Page</a>
</div>

<script>
const input = document.getElementById('photoInput');
const output = document.getElementById('output');
const mapDiv = document.getElementById('map');

input.addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
        const img = new Image();
        img.src = e.target.result;

        img.onload = function () {
            EXIF.getData(img, function () {
                const tags = EXIF.getAllTags(this);

                let hasMetadata = Object.keys(tags).length > 0;
                let hasGPS = tags.GPSLatitude && tags.GPSLongitude;

                // Determine status
                const statusClass = (!hasMetadata || !hasGPS) ? 'danger' : 'safe';
                output.className = statusClass;

                let metadataHTML = `<h2>Photo Metadata</h2>`;
                if (!hasMetadata) {
                    metadataHTML += `<p>No metadata found — possible suspicious image.</p>`;
                } else {
                    metadataHTML += `<ul>`;
                    for (let key in tags) {
                        metadataHTML += `<li><strong>${key}:</strong> ${tags[key]}</li>`;
                    }
                    metadataHTML += `</ul>`;
                }

                if (hasGPS) {
                    const lat = tags.GPSLatitude;
                    const lon = tags.GPSLongitude;
                    const latRef = tags.GPSLatitudeRef;
                    const lonRef = tags.GPSLongitudeRef;

                    const latitude = (lat[0] + lat[1] / 60 + lat[2] / 3600) * (latRef === "N" ? 1 : -1);
                    const longitude = (lon[0] + lon[1] / 60 + lon[2] / 3600) * (lonRef === "E" ? 1 : -1);

                    metadataHTML += `<p><strong>Coordinates:</strong> ${latitude}, ${longitude}</p>`;
                    fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`)
                        .then(res => res.json())
                        .then(data => {
                            const address = data.display_name || "Unknown Location";
                            metadataHTML += `<p><strong>Place Name:</strong> ${address}</p>`;
                            output.innerHTML = metadataHTML;
                        });

                    mapDiv.style.display = "block";
                    mapDiv.innerHTML = `
                        <iframe width="100%" height="100%" 
                        src="https://maps.google.com/maps?q=${latitude},${longitude}&z=14&output=embed">
                        </iframe>`;
                } else {
                    mapDiv.style.display = "none";
                    metadataHTML += `<p><strong>Coordinates:</strong> Not available</p>`;
                    metadataHTML += `<p><strong>Place Name:</strong> Not available</p>`;
                    output.innerHTML = metadataHTML;
                }
            });
        };
    };

    reader.readAsDataURL(file);
});
</script>

</body>
</html>
